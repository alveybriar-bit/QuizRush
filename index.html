    /**
     * PROCEDURAL SYNTHESIZED WEB AUDIO API SOUND SYSTEM
     */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      play(freq, type = 'sine', duration = 0.15, vol = 0.2, pitchBend = 0) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          if (pitchBend !== 0) {
            osc.frequency.exponentialRampToValueAtTime(freq + pitchBend, this.ctx.currentTime + duration);
          }
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.error(e);
        }
      }

      correct() {
        this.play(523.25, 'triangle', 0.12, 0.25, 200); // C5
        setTimeout(() => this.play(659.25, 'triangle', 0.12, 0.25, 200), 80); // E5
        setTimeout(() => this.play(783.99, 'triangle', 0.25, 0.3, 300), 160); // G5
        this.haptic([20, 30, 40]);
      }

      wrong() {
        this.play(180, 'sawtooth', 0.25, 0.3, -60);
        this.haptic([100, 50, 100]);
      }

      tick() {
        this.play(800, 'sine', 0.04, 0.08);
      }

      urgentTick() {
        this.play(1100, 'sawtooth', 0.06, 0.18);
        this.haptic(15);
      }

      clutch() {
        this.play(440, 'square', 0.1, 0.25, 400);
        setTimeout(() => this.play(880, 'triangle', 0.3, 0.35, 600), 100);
        this.haptic([40, 40, 80]);
      }

      powerup() {
        this.play(300, 'sine', 0.15, 0.2, 500);
        setTimeout(() => this.play(600, 'sine', 0.2, 0.25, 600), 100);
        this.haptic(30);
      }

      streak() {
        this.play(587.33, 'triangle', 0.12, 0.25);
        setTimeout(() => this.play(739.99, 'triangle', 0.12, 0.25), 80);
        setTimeout(() => this.play(880.00, 'triangle', 0.15, 0.3), 160);
        setTimeout(() => this.play(1174.66, 'triangle', 0.35, 0.35), 240);
        this.haptic([30, 40, 60, 80]);
      }

      unbox() {
        this.play(350, 'square', 0.1, 0.2);
        setTimeout(() => this.play(500, 'square', 0.12, 0.25), 100);
        setTimeout(() => this.play(700, 'triangle', 0.15, 0.3), 200);
        setTimeout(() => this.play(1050, 'triangle', 0.4, 0.4), 300);
      }

      haptic(pattern) {
        if ('vibrate' in navigator) {
          try {
            navigator.vibrate(pattern);
          } catch (e) {}
        }
      }
    }

    /**
     * PARTICLE BURST CANVAS FX
     */
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerParticleBurst(x, y, count = 35, colors = ['#00f0ff', '#ff007f', '#ffde00', '#00ff88']) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 3;
        particles.push({
          x: x || window.innerWidth / 2,
          y: y || window.innerHeight / 2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 4 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.025 + 0.015
        });
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.18; // gravity
        p.alpha -= p.decay;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /**

     */
    const STORAGE_KEY = 'quizrush_pilot_v1';

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          return JSON.parse(saved);
        } catch (e) {}
      }
      return {
        playerName: 'CyberRunner',
        coins: 250,
        xp: 0,
        streakRecord: 0,
        powerups: {
          fifty: 2,
          freeze: 2,

        lootBoxes: 1,
        dailyStreak: 1,
        lastDailyEpoch: 0
      };
    }

    let state = loadState();

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // Daily streak check
    function checkDailyReward() {
      const todayEpoch = Math.floor(Date.now() / (1000 * 60 * 60 * 24));
      if (state.lastDailyEpoch === 0) {
        state.lastDailyEpoch = todayEpoch;
        state.dailyStreak = 1;
        state.coins += 200;
        saveState();
        showNotification('🎁 Welcome Bonus: +200 Rush Coins!', '#ffde00');
      } else if (todayEpoch > state.lastDailyEpoch) {
        if (todayEpoch === state.lastDailyEpoch + 1) {
          state.dailyStreak++;
        } else {
          state.dailyStreak = 1;
        }
        state.lastDailyEpoch = todayEpoch;
        const reward = Math.min(150 + state.dailyStreak * 50, 750);
        state.coins += reward;
        saveState();
        showNotification(`🔥 Day ${state.dailyStreak} Streak Bonus: +${reward} Coins!`, '#ffde00');
        sound.streak();
      }
    }

    /**
     * GAME ENGINE LOGIC
     */
    function startNewGame(mode, category) {
      sound.init();
      sound.play(440, 'triangle', 0.2, 0.3, 400);

      let pool = [...QUESTION_BANK];
      if (category !== 'all') {
        pool = pool.filter(q => q.category === category);
      }
      pool.sort(() => Math.random() - 0.5);

      const limit = mode === 'classic' ? 10 : (mode === 'sudden' ? 30 : 40);
      const chosen = pool.slice(0, limit);

      const initTime = mode === 'classic' ? 15 : (mode === 'sudden' ? 12 : 60);

      game = {
        active: true,
        mode: mode,
        category: category,
        questions: chosen,
        currentIndex: 0,
        score: 0,
        streak: 0,
        maxStreak: 0,
        shieldActive: false,
        timer: initTime,
        timerMax: initTime,
        timerFrozen: false,
        freezeTimeLeft: 0,
        interval: null,
        answerLocked: false,
        eliminatedIndices: [],
        answersHistory: [],
        fastestAnswer: 999,
        startTime: Date.now(),
        sessionCoins: 0,
        sessionXp: 0
      };

      setScreen('playing');
      startTimer();
    }

    function startTimer() {
      clearInterval(game.interval);
      game.interval = setInterval(() => {
        if (!game.active || game.answerLocked) return;

        if (game.timerFrozen) {
          game.freezeTimeLeft -= 0.1;
          if (game.freezeTimeLeft <= 0) {
            game.timerFrozen = false;
            showNotification('Cryo-Freeze Expired!', '#2979ff');
          }
          renderPlayingHud();
          return;
        }

        game.timer -= 0.1;

        if (game.timer <= 3.2 && game.timer > 0) {
          if (Math.floor(game.timer * 10) % 10 === 0) {
            sound.urgentTick();
          }
        }

        if (game.timer <= 0) {
          game.timer = 0;
          clearInterval(game.interval);
          handleTimeout();
        }

        renderPlayingHud();
      }, 100);
    }

    function handleTimeout() {
      sound.wrong();
      const curQ = game.questions[game.currentIndex];
      game.answersHistory.push({
        prompt: curQ.prompt,
        correctText: curQ.options[curQ.correct],
        chosenText: 'TIMEOUT',
        isCorrect: false,
        timeSpent: game.timerMax
      });

      if (game.shieldActive) {
        game.shieldActive = false;
        showNotification('Aegis Shield Absorbed Timeout!', '#00f0ff');
      } else {
        game.streak = 0;
      }

      if (game.mode === 'sudden') {
        endGame(false);
      } else {
        game.answerLocked = true;
        renderApp();
        setTimeout(() => advanceQuestion(), 2000);
      }
    }

    function submitAnswer(chosenIdx) {
      if (game.answerLocked) return;
      game.answerLocked = true;
      clearInterval(game.interval);

      const curQ = game.questions[game.currentIndex];
      const isCorrect = chosenIdx === curQ.correct;
      const timeSpent = Math.max(0.1, (game.timerMax - game.timer));

      if (timeSpent < game.fastestAnswer) {
        game.fastestAnswer = timeSpent;
      }

      // Check Clutch Bonus (answered correctly with < 2 seconds on the clock)
      const isClutch = isCorrect && game.timer <= 2.0 && !game.timerFrozen;

      if (isCorrect) {
        sound.correct();
        triggerParticleBurst(window.innerWidth / 2, window.innerHeight * 0.45);

        game.streak++;
        if (game.streak > game.maxStreak) game.maxStreak = game.streak;
        if (game.streak > state.streakRecord) state.streakRecord = game.streak;

        const mult = 1.0 + Math.min(game.streak, 6) * 0.25;
        const speedBonus = timeSpent < 3 ? 50 : (timeSpent < 6 ? 25 : 0);
        const clutchBonusXp = isClutch ? 150 : 0;
        const clutchBonusCoins = isClutch ? 25 : 0;

        const baseScore = curQ.difficulty === 'HARD' ? 150 : (curQ.difficulty === 'MEDIUM' ? 100 : 60);
        const earnedPoints = Math.round((baseScore + speedBonus) * mult);

        game.score += earnedPoints;
        const earnedCoins = 10 + (game.streak * 2) + clutchBonusCoins;
        const earnedXp = Math.round(earnedPoints * 0.5) + clutchBonusXp;

        game.sessionCoins += earnedCoins;
        game.sessionXp += earnedXp;
        state.coins += earnedCoins;
        state.xp += earnedXp;

        if (isClutch) {
          sound.clutch();
          showNotification('🔥 CLUTCH REFLEX! +150 XP!', '#ffde00');
        } else if (game.streak % 3 === 0) {
          sound.streak();
          showNotification(`🔥 OVERDRIVE x${game.streak} STREAK!`, '#ffde00');
        } else {
          showNotification(`+${earnedPoints} PTS!`, '#00ff88');
        }

        // Mystery loot box every 5 correct
        const totalCorrect = game.answersHistory.filter(a => a.isCorrect).length + 1;
        if (totalCorrect % 5 === 0) {
          state.lootBoxes++;
          sound.unbox();
          showNotification('🎁 MYSTERY LOOT BOX EARNED!', '#ffde00');
        }
      } else {
        sound.wrong();
        const mainCard = document.getElementById('questionMainCard');
        if (mainCard) {
          mainCard.classList.add('animate-shake');
          setTimeout(() => mainCard.classList.remove('animate-shake'), 450);
        }

        if (game.shieldActive) {
          game.shieldActive = false;
          showNotification('🛡️ Aegis Shield Protected Streak!', '#00f0ff');
        } else {
          game.streak = 0;
        }

        if (game.mode === 'sudden') {
          saveState();
          game.answersHistory.push({
            prompt: curQ.prompt,
            correctText: curQ.options[curQ.correct],
            chosenText: curQ.options[chosenIdx],
            isCorrect: false,
            timeSpent: timeSpent
          });
          setTimeout(() => endGame(false), 1400);
          return;
        }
      }

      saveState();

      game.answersHistory.push({
        prompt: curQ.prompt,
        correctText: curQ.options[curQ.correct],
        chosenText: curQ.options[chosenIdx],
        isCorrect: isCorrect,
        timeSpent: timeSpent
      });

      renderApp();
      setTimeout(() => advanceQuestion(), 2400);
    }

    function advanceQuestion() {
      game.currentIndex++;
      if (game.currentIndex >= game.questions.length) {
        endGame(true);
      } else {
        game.answerLocked = false;
        game.eliminatedIndices = [];

        if (game.mode === 'classic') {
          // Escalating timer: starts at 15 down to 5 seconds
          const step = Math.min(game.currentIndex, 8);
          game.timer = Math.max(5, 15 - step * 1.2);
          game.timerMax = game.timer;
        } else if (game.mode === 'sudden') {
          game.timer = Math.max(6, 12 - game.currentIndex * 0.2);
          game.timerMax = game.timer;
        }
        // Blitz timer continues running down from 60

        renderApp();
        startTimer();
      }
    }

    function endGame(isVictory) {
      game.active = false;
      clearInterval(game.interval);
      saveState();
      sound.play(523.25, 'triangle', 0.2, 0.3);
      setTimeout(() => sound.play(783.99, 'triangle', 0.35, 0.35), 150);
      setScreen('gameover');
    }

    // Power-up triggers
    function usePowerUp(type) {
      if (game.answerLocked || !game.active) return;
      if (state.powerups[type] <= 0) {
        showNotification('No charges remaining! Visit Armory.', '#ff2a55');
        sound.wrong();
        return;
      }

      const curQ = game.questions[game.currentIndex];

      if (type === 'fifty') {
        if (game.eliminatedIndices.length > 0) return;
        state.powerups.fifty--;
        sound.powerup();
        const wrongIndices = [0, 1, 2, 3].filter(idx => idx !== curQ.correct);
        wrongIndices.sort(() => Math.random() - 0.5);
        game.eliminatedIndices = wrongIndices.slice(0, 2);
        showNotification('⚡ 50/50 Glitched 2 Wrong Choices!', '#ff007f');
      } else if (type === 'freeze') {
        if (game.timerFrozen) return;
        state.powerups.freeze--;
        sound.powerup();
        game.timerFrozen = true;
        game.freezeTimeLeft = 5.0;
        showNotification('❄️ Chrono Freeze: 5 Seconds Gained!', '#2979ff');
      } else if (type === 'shield') {
        if (game.shieldActive) return;
        state.powerups.shield--;
        sound.powerup();
        game.shieldActive = true;
        showNotification('🛡️ Aegis Shield Activated!', '#00f0ff');
      }

      saveState();
      renderApp();
    }

    function openLootBox() {
      if (state.lootBoxes <= 0) {
        showNotification('No Mystery Loot Boxes available!', '#ff2a55');
        return;
      }
      state.lootBoxes--;
      sound.unbox();
      triggerParticleBurst(window.innerWidth / 2, window.innerHeight / 2, 45, ['#ffde00', '#ff007f', '#00f0ff']);

      const coins = Math.floor(Math.random() * 200) + 120;
      const xp = Math.floor(Math.random() * 150) + 80;
      const powerupTypes = ['fifty', 'freeze', 'shield'];
      const pType = powerupTypes[Math.floor(Math.random() * powerupTypes.length)];
      state.coins += coins;
      state.xp += xp;
      state.powerups[pType]++;
      saveState();

      renderLootBoxModal(coins, xp, pType);
    }

        const pct = Math.max(0, Math.min(100, (game.timer / game.timerMax) * 100));
        bar.style.width = `${pct}%`;
        label.innerText = game.timerFrozen ? `❄️ FROZEN (${game.freezeTimeLeft.toFixed(1)}s)` : `TIME: ${game.timer.toFixed(1)}s`;
      }
    }

    function handleQuitGame() {
      if (confirm('Abandon current QuizRush run?')) {

    // 4. GAME OVER & ANALYTICS DASHBOARD
    function renderGameOverScreen() {
      const total = game.answersHistory.length;
      const correct = game.answersHistory.filter(a => a.isCorrect).length;
      const accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;
      const avgSpeed = total > 0 ? (game.answersHistory.reduce((acc, c) => acc + c.timeSpent, 0) / total).toFixed(2) : '0.00';

      let grade = 'C';
      let ratingStatement = 'NEURAL REBOOT REQUIRED';
      let gradeColor = '#ff2a55';

      if (accuracy >= 90 && avgSpeed < 4.5) {
        grade = 'S+';
        ratingStatement = 'GODLIKE SYNAPSE OVERLOAD';
        gradeColor = '#ffde00';
      } else if (accuracy >= 80) {
        grade = 'S';
        ratingStatement = 'CYBER ELITE OPERATIVE';
        gradeColor = '#00f0ff';
      } else if (accuracy >= 65) {
        grade = 'A';
        ratingStatement = 'SHARP TACTICAL RUNNER';
        gradeColor = '#00ff88';
      } else if (accuracy >= 50) {
        grade = 'B';
        ratingStatement = 'NEURAL APPRENTICE';
        gradeColor = '#2979ff';
      }

      return `
        <div class="flex-1 flex flex-col justify-between py-2 animate-fadeIn">

            <!-- Header Result Badge -->
            <div class="text-center my-3">
              <div class="inline-block px-4 py-1 rounded-full text-xs font-arcade font-black uppercase mb-1" style="background: ${gradeColor}20; color: ${gradeColor}; border: 1px solid ${gradeColor}">

                  <div class="text-[10px] text-slate-400 font-bold uppercase">ACCURACY</div>
                  <div class="text-lg font-arcade font-black text-cyber-green mt-0.5">${accuracy}%</div>
                  <div class="text-[9px] text-slate-500">${correct}/${total} Answered</div>
                </div>

                <div class="bg-cyber-surface p-2.5 rounded-xl border border-slate-800">
                  <div class="text-[10px] text-slate-400 font-bold uppercase">AVG SPEED</div>
                  <div class="text-lg font-arcade font-black text-cyber-cyan mt-0.5">${avgSpeed}s</div>

                  <div class="text-[9px] text-slate-500">Multiplier Peak</div>
                </div>

                <div class="bg-cyber-surface p-2.5 rounded-xl border border-slate-800">
                  <div class="text-[10px] text-slate-400 font-bold uppercase">FASTEST HIT</div>
                  <div class="text-lg font-arcade font-black text-cyber-pink mt-0.5">${game.fastestAnswer < 50 ? game.fastestAnswer.toFixed(2) + 's' : '-'}</div>

                  <div class="text-[9px] text-slate-500">Retro Synth</div>
                </button>
                <button onclick="applyTheme('midnight')" class="p-2.5 rounded-xl border text-left text-xs font-bold transition ${state.theme === 'midnight' ? 'border-green-400 bg-green-400/20 text-green-400' : 'glass-panel text-slate-400 border-slate-800'}">
                  <div>MIDNIGHT</div>
                  <div class="text-[9px] text-slate-500">Pure OLED</div>
                </button>
              </div>
            </div>

            <!-- Tactical Power-Up Shop -->
            <div class="mb-4">
              <div class="text-xs font-arcade font-bold text-slate-400 uppercase mb-2">RESTOCK POWER-UPS (75 COINS EACH)</div>
              <div class="flex flex-col gap-2">
                <div class="glass-panel p-3 rounded-xl border border-cyber-pink/40 flex items-center justify-between">
                  <div class="text-left">
                    <div class="text-xs font-bold text-cyber-pink">50/50 Glitch Eliminator</div>
                    <div class="text-[10px] text-slate-400">Current Stock: ${state.powerups.fifty}</div>
                  </div>
                  <button onclick="buyPowerUp('fifty', 75)" class="px-3 py-1.5 rounded-lg bg-cyber-pink hover:bg-pink-600 text-black font-arcade font-black text-xs transition">
                    BUY 75🪙
                  </button>
                </div>

                <div class="glass-panel p-3 rounded-xl border border-cyber-blue/40 flex items-center justify-between">
                  <div class="text-left">
                    <div class="text-xs font-bold text-cyber-blue">Chrono Freeze (+5s)</div>
                    <div class="text-[10px] text-slate-400">Current Stock: ${state.powerups.freeze}</div>
                  </div>
                  <button onclick="buyPowerUp('freeze', 75)" class="px-3 py-1.5 rounded-lg bg-cyber-blue hover:bg-blue-600 text-black font-arcade font-black text-xs transition">
                    BUY 75🪙
                  </button>
                </div>

                <div class="glass-panel p-3 rounded-xl border border-cyber-cyan/40 flex items-center justify-between">
                  <div class="text-left">
                    <div class="text-xs font-bold text-cyber-cyan">Aegis Streak Shield</div>
                    <div class="text-[10px] text-slate-400">Current Stock: ${state.powerups.shield}</div>
                  </div>
                  <button onclick="buyPowerUp('shield', 75)" class="px-3 py-1.5 rounded-lg bg-cyber-cyan hover:bg-cyan-300 text-black font-arcade font-black text-xs transition">
                    BUY 75🪙
                  </button>
                </div>
              </div>
            </div>

            <!-- Avatar Frames Vault -->
            <div>
              <div class="text-xs font-arcade font-bold text-slate-400 uppercase mb-2">NEURAL AVATAR FRAMES</div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                ${AVATAR_FRAMES.map(frame => {
                  const isUnlocked = state.unlockedFrames.includes(frame.id);
                  const isEquipped = state.avatarFrame === frame.id;
                  return `
                    <div class="glass-panel p-2.5 rounded-xl border flex items-center justify-between" style="border-color: ${isEquipped ? frame.color : 'rgba(255,255,255,0.1)'}">
                      <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs border-2" style="border-color: ${frame.color}; color: ${frame.color}">
                          ${state.playerName.charAt(0)}
                        </div>
                        <div>
                          <div class="text-xs font-bold text-slate-200">${frame.title}</div>
                          <div class="text-[10px] text-slate-500">${frame.price === 0 ? 'Standard' : frame.price + ' Coins'}</div>
                        </div>
                      </div>
                      ${isEquipped ? `
                        <span class="text-[10px] font-bold text-cyber-green px-2 py-0.5 rounded bg-cyber-green/20">EQUIPPED</span>
                      ` : (isUnlocked ? `
                        <button onclick="equipFrame('${frame.id}')" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs font-bold text-white transition">EQUIP</button>
                      ` : `
                        <button onclick="unlockFrame('${frame.id}', ${frame.price})" class="px-2.5 py-1 rounded bg-cyber-yellow hover:bg-yellow-400 text-black text-xs font-bold transition">UNLOCK</button>
                      `)}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>

          <div class="mt-4">
            <button onclick="setScreen('home')" class="w-full py-3 rounded-xl glass-panel text-slate-300 hover:text-white font-bold text-xs tracking-wider transition">
              RETURN TO HUB
            </button>
          </div>
        </div>
      `;
    }

    function buyPowerUp(type, cost) {
      if (state.coins < cost) {
        showNotification('Not enough Rush Coins!', '#ff2a55');
        sound.wrong();
        return;
      }
      state.coins -= cost;
      state.powerups[type]++;
      saveState();
      sound.powerup();
      showNotification(`+1 ${type.toUpperCase()} Stocked!`, '#00ff88');
      renderApp();
    }

    function unlockFrame(frameId, price) {
      if (state.coins < price) {
        showNotification('Not enough Rush Coins!', '#ff2a55');
        sound.wrong();
        return;
      }
      state.coins -= price;
      state.unlockedFrames.push(frameId);
      state.avatarFrame = frameId;
      saveState();
      sound.streak();
      showNotification('Avatar Frame Unlocked & Equipped!', '#00ff88');
      renderApp();
    }

    function equipFrame(frameId) {
      state.avatarFrame = frameId;
      saveState();
      sound.powerup();
      renderApp();
    }

    /**
     * MODAL DIALOGS: FLEX CARD & LOOT BOX
     */
    function openFlexCardModal(grade, ratingStatement, accuracy, avgSpeed) {
      const rank = getRank(state.xp);
      const frame = AVATAR_FRAMES.find(f => f.id === state.avatarFrame) || AVATAR_FRAMES[0];

      const modal = document.createElement('div');
      modal.id = 'activeModal';
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fadeIn';
      modal.innerHTML = `
        <div class="w-full max-w-sm glass-panel p-5 rounded-3xl border-2 border-cyber-yellow shadow-[0_0_35px_rgba(255,222,0,0.4)] text-center relative">
          <button onclick="closeModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white text-lg">✕</button>

          <div class="text-[10px] font-arcade font-bold tracking-widest text-cyber-yellow uppercase mb-2">OFFICIAL FLEX CARD</div>

          <!-- Flex Card Body -->
          <div class="glass-panel p-4 rounded-2xl border" style="border-color: ${frame.color}">
            <div class="flex items-center gap-3 text-left">
              <div class="w-12 h-12 rounded-full flex items-center justify-center font-arcade font-black text-lg border-2" style="border-color: ${frame.color}; color: ${frame.color}">
                ${state.playerName.charAt(0)}
              </div>
              <div class="flex-1">
                <div class="font-arcade font-black text-base text-slate-100">${state.playerName}</div>
                <div class="text-[11px] font-bold" style="color: ${rank.color}">RANK: ${rank.title}</div>
              </div>
              <div class="px-2.5 py-1 rounded-lg bg-cyber-yellow/20 border border-cyber-yellow font-arcade font-black text-xl text-cyber-yellow">
                ${grade}
              </div>
            </div>

            <div class="my-4">
              <div class="text-3xl font-arcade font-black text-cyber-cyan">${game.score} PTS</div>
              <div class="text-xs font-bold text-cyber-green mt-0.5 tracking-wider">${ratingStatement}</div>
            </div>

            <div class="grid grid-cols-3 gap-1.5 text-center text-xs">
              <div class="bg-cyber-surface p-1.5 rounded-lg border border-slate-800">
                <div class="text-[9px] text-slate-400">ACCURACY</div>
                <div class="font-black text-cyber-green text-sm">${accuracy}%</div>
              </div>
              <div class="bg-cyber-surface p-1.5 rounded-lg border border-slate-800">
                <div class="text-[9px] text-slate-400">SPEED</div>
                <div class="font-black text-cyber-cyan text-sm">${avgSpeed}s</div>
              </div>
              <div class="bg-cyber-surface p-1.5 rounded-lg border border-slate-800">
                <div class="text-[9px] text-slate-400">STREAK</div>
                <div class="font-black text-cyber-yellow text-sm">${game.maxStreak}x</div>
              </div>
            </div>

            <!-- MANDATORY WATERMARK -->
            <div class="mt-4 pt-2 border-t border-slate-800 text-[10px] text-cyber-pink font-bold italic">
              ⚡ QUIZRUSH · Created by Jessie Israel
            </div>
          </div>

          <div class="mt-4 flex gap-2">
            <button onclick="shareScoreCard('${grade}', ${game.score}, ${accuracy})" class="flex-1 py-3 rounded-xl bg-cyber-cyan hover:bg-cyan-300 text-black font-arcade font-bold text-xs tracking-wider transition">
              SHARE FLEX CARD
            </button>
            <button onclick="closeModal()" class="px-4 py-3 rounded-xl glass-panel text-slate-300 hover:text-white text-xs font-bold">
              CLOSE
            </button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function renderLootBoxModal(coins, xp, pType) {
      const modal = document.createElement('div');
      modal.id = 'activeModal';
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fadeIn';
      modal.innerHTML = `
        <div class="w-full max-w-sm glass-panel p-5 rounded-3xl border-2 border-cyber-yellow shadow-[0_0_35px_rgba(255,222,0,0.5)] text-center">
          <div class="w-16 h-16 mx-auto rounded-full flex items-center justify-center text-3xl bg-cyber-yellow/20 border-2 border-cyber-yellow animate-bounce mb-3">
            🎁
          </div>
          <h2 class="text-lg font-arcade font-black text-cyber-yellow uppercase">MYSTERY LOOT UNBOXED!</h2>
          <p class="text-xs text-slate-400 mt-1">Tactical drops earned from answering consecutive trivia correct:</p>

          <div class="glass-panel p-3 rounded-xl my-4 flex flex-col gap-2 text-xs font-bold text-left border border-slate-700">
            <div class="flex justify-between items-center text-cyber-yellow">
              <span>Rush Coins:</span>
              <span class="text-sm font-black">+${coins} 🪙</span>
            </div>
            <div class="flex justify-between items-center text-cyber-cyan">
              <span>Neural XP:</span>
              <span class="text-sm font-black">+${xp} XP</span>
            </div>
            <div class="flex justify-between items-center text-cyber-pink">
              <span>Tactical Power-Up:</span>
              <span class="text-sm font-black">+1 ${pType.toUpperCase()}</span>
            </div>
          </div>

          <button onclick="closeModal()" class="w-full py-3 rounded-xl bg-cyber-yellow text-black font-arcade font-bold text-xs tracking-widest hover:bg-yellow-300 transition">
            CLAIM REWARDS
          </button>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function closeModal() {
      const modal = document.getElementById('activeModal');
      if (modal) modal.remove();
      renderApp();
    }

    function shareScoreCard(grade, score, accuracy) {
      const text = `⚡ QUIZRUSH CYBER ARCADE ⚡\nPilot: ${state.playerName}\nScore: ${score} PTS | Grade: ${grade}\nAccuracy: ${accuracy}%\nCreated by Jessie Israel · Play QuizRush now!`;
      if (navigator.share) {
        navigator.share({
          title: 'QuizRush Scorecard',
          text: text
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(text);
        showNotification('Scorecard copied to clipboard!', '#00ff88');
      }
    }

    // Initialize App
    window.addEventListener('DOMContentLoaded', () => {
      checkDailyReward();
      applyTheme(state.theme);
      renderApp();

      // Register Service Worker for offline PWA
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    });
  </script>
</body>
</html>
